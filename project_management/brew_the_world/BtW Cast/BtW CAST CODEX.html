<html lang="en">
<head>
<meta charset="UTF-8">

<title>BREW the WORLD — Cast Codex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --bg: #0f1109;
    --bg-panel: #171911;
    --bg-card: #1c1f16;
    --ink: #e9e4d4;
    --ink-dim: #9c9686;
    --line: #33362a;
    --botanical: #6b9b6e;
    --botanical-dim: #2a3a2a;
    --food: #d1a13e;
    --food-dim: #3a3122;
    --animal: #b0794a;
    --animal-dim: #362a1e;
    --elemental: #8a7a72;
    --elemental-dim: #2e2924;
    --gold: #e0a020;
    --swing: #cc7a2e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    background-image: radial-gradient(ellipse at top, #1a1d12 0%, #0f1109 60%);
    color: var(--ink);
    font-family: 'Karla', sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 48px 32px 24px;
    text-align: center;
    border-bottom: 1px solid var(--line);
  }
  h1 {
    font-family: 'Spectral', serif;
    font-weight: 600;
    font-size: clamp(28px, 5vw, 44px);
    letter-spacing: 0.02em;
    margin: 0 0 6px;
    color: var(--gold);
  }
  .subtitle {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .controls {
    max-width: 1100px;
    margin: 28px auto 0;
    padding: 0 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }
  .chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg-panel);
    color: var(--ink-dim);
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
  }
  .chip:hover { border-color: var(--gold); color: var(--ink); }
  .chip.active {
    background: var(--gold);
    border-color: var(--gold);
    color: #1a1400;
    font-weight: 500;
  }
  .search {
    font-family: 'Karla', sans-serif;
    font-size: 14px;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg-panel);
    color: var(--ink);
    width: 200px;
  }
  .search:focus { outline: none; border-color: var(--gold); }
  .search::placeholder { color: var(--ink-dim); }

  .gen-block { margin-bottom: 56px; }
  .gen-title {
    font-family: 'Spectral', serif;
    font-style: italic;
    font-size: 20px;
    color: var(--ink-dim);
    border-bottom: 1px solid var(--line);
    padding-bottom: 10px;
    margin-bottom: 24px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 18px;
  }

  .card {
    position: relative;
    aspect-ratio: 5 / 7.5;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 12px 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 5px;
    border: 1px solid currentColor;
    opacity: 0.35;
    border-radius: 9px;
    pointer-events: none;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 24px rgba(0,0,0,0.4);
  }
  .card.cat-botanical { color: var(--botanical); }
  .card.cat-food { color: var(--food); }
  .card.cat-animal { color: var(--animal); }
  .card.cat-elemental { color: var(--elemental); }
  .card.cat-botanical { border-color: var(--botanical-dim); }
  .card.cat-food { border-color: var(--food-dim); }
  .card.cat-animal { border-color: var(--animal-dim); }
  .card.cat-elemental { border-color: var(--elemental-dim); }
  .card:hover.cat-botanical { border-color: var(--botanical); }
  .card:hover.cat-food { border-color: var(--food); }
  .card:hover.cat-animal { border-color: var(--animal); }
  .card:hover.cat-elemental { border-color: var(--elemental); }

  .card-symbol { font-size: 22px; opacity: 0.8; line-height: 1; }
  .card-portrait {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--line);
    margin-bottom: 6px;
    display: block;
  }
  .detail-portrait {
    width: 100%;
    max-height: 320px;
    object-fit: cover;
    border-radius: 10px;
    border: 1px solid var(--line);
    margin-bottom: 16px;
    display: block;
  }
  .card-name {
    font-family: 'Spectral', serif;
    font-weight: 600;
    font-size: 17px;
    color: var(--ink);

  .card-role {
    font-size: 11px;
    color: var(--ink-dim);
    line-height: 1.35;
    margin-top: 4px;
    flex-grow: 1;
    overflow: hidden;
  }
  .card-tags {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.03em;
    padding: 2px 6px;
    border-radius: 4px;
    background: rgba(255,255,255,0.06);
    color: var(--ink-dim);
  }
  .tag.swing { background: var(--swing); color: #1a1000; font-weight: 500; }
  .card-tarot-note {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    color: currentColor;
    opacity: 0.75;
    margin-top: auto;
    padding-top: 6px;
    border-top: 1px dashed currentColor;
  }

  /* Modal */
  #overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(5,6,3,0.82);
    backdrop-filter: blur(3px);
    z-index: 50;
    padding: 40px 20px;
    overflow-y: auto;
  }
  #overlay.open { display: flex; justify-content: center; align-items: flex-start; }
  .detail {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    max-width: 640px;
    width: 100%;
    padding: 32px 36px 36px;
    position: relative;
  }
  .detail-close {
    position: absolute; top: 18px; right: 20px;
    font-family: 'IBM Plex Mono', monospace;
    background: none; border: 1px solid var(--line); color: var(--ink-dim);
    width: 32px; height: 32px; border-radius: 50%;
    cursor: pointer; font-size: 16px;
  }
  .detail-close:hover { color: var(--ink); border-color: var(--gold); }
  .detail-eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
  }
  .detail-name {
    font-family: 'Spectral', serif; font-weight: 600;
    font-size: 32px; margin: 4px 0 2px; color: var(--ink);
  }
  .detail-role { color: var(--ink-dim); font-size: 14px; margin-bottom: 20px; }
  .detail-tarot {
    font-family: 'Spectral', serif; font-style: italic;
    font-size: 14px; color: var(--gold); margin-bottom: 20px;
    padding: 10px 14px; border: 1px dashed var(--gold); border-radius: 8px;
    background: rgba(224,160,32,0.06);
  }
  .field { margin-bottom: 18px; }
  .field-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-dim);
    display: flex; align-items: center; gap: 8px; margin-bottom: 5px;
  }
  .field-text { font-size: 14.5px; line-height: 1.55; }
  .badge-static, .badge-dynamic {
    font-family: 'IBM Plex Mono', monospace; font-size: 9px;
    padding: 1px 6px; border-radius: 3px;
  }
  .badge-static { background: rgba(255,255,255,0.07); color: var(--ink-dim); }
  .badge-dynamic { background: var(--swing); color: #1a1000; }
  .connections { display: flex; flex-direction: column; gap: 8px; }
  .connection {
    font-size: 13px; line-height: 1.45; padding: 8px 12px;
    background: rgba(255,255,255,0.03); border-left: 2px solid var(--line); border-radius: 4px;
  }
  .connection b { color: var(--ink); }
  .inspiration {
    font-size: 13px; font-style: italic; color: var(--ink-dim);
    line-height: 1.5;
  }
  .placeholder-note {
    font-size: 12px; color: var(--ink-dim); font-style: italic;
  }
</style>
</head>

const CATEGORY_SYMBOL = {
  'Botanical': '\u2698',
  'Food': '\u2740',
  'Animal': '\u25B3',
  'Elemental': '\u25C6'
};
function categoryClass(catStr) {
  const c = catStr.toLowerCase();
  if (c.includes('food')) return 'food';
  if (c.includes('animal')) return 'animal';
  if (c.includes('elemental')) return 'elemental';
  if (c.includes('botanical')) return 'botanical';
  return 'elemental';
}
function categorySymbol(catStr) {
  const cls = categoryClass(catStr);
  return {botanical:'\u2698', food:'\u2740', animal:'\u25B3', elemental:'\u25C6'}[cls];
}

const GEN_ORDER = ['Trifecta (elder)', 'Established (middle)', "Fennel's Generation", 'N/A — a Hollow'];

let state = { generation: 'All', category: 'All', swingOnly: false, search: '' };

function buildControls() {
  const el = document.getElementById('controls');
  const gens = ['All', ...GEN_ORDER];
  const cats = ['All', 'Botanical', 'Food', 'Animal', 'Elemental'];
  el.innerHTML = `
    <input class="search" id="search" placeholder="Search cast...">
    ${gens.map(g => `<div class="chip gen-chip ${g==='All'?'active':''}" data-gen="${g}">${g}</div>`).join('')}
    ${cats.map(c => `<div class="chip cat-chip" data-cat="${c}">${c}</div>`).join('')}
    <div class="chip" id="swing-chip">Swing only</div>
  `;
  document.querySelectorAll('.gen-chip').forEach(chip => {
    chip.onclick = () => {
      document.querySelectorAll('.gen-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      state.generation = chip.dataset.gen;
      render();
    };
  });
  document.querySelectorAll('.cat-chip').forEach(chip => {
    chip.onclick = () => {
      const isActive = chip.classList.contains('active');
      document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
      if (!isActive) { chip.classList.add('active'); state.category = chip.dataset.cat; }
      else state.category = 'All';
      render();
    };
  });
  document.getElementById('swing-chip').onclick = (e) => {
    state.swingOnly = !state.swingOnly;
    e.target.classList.toggle('active');
    render();
  };
  document.getElementById('search').oninput = (e) => {
    state.search = e.target.value.toLowerCase();
    render();
  };
}

function cardHTML(name, c) {
  const cls = categoryClass(c.category);
  const sym = categorySymbol(c.category);
  const tarotNote = c.tarot ? `${c.tarot.position} — ${c.tarot.card}` : '';
  const topVisual = c.image
    ? `<img class="card-portrait" src="${c.image}" alt="${name}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'card-symbol',textContent:'${sym}'}))">`
    : `<div class="card-symbol">${sym}</div>`;
  return `
    <div class="card cat-${cls}" data-name="${name}">
      ${topVisual}
      <div class="card-name">${name}</div>
      <div class="card-role">${c.role}</div>
      <div class="card-tags">
        ${c.is_swing ? '<span class="tag swing">SWING</span>' : ''}
        <span class="tag">${c.generation.split(' (')[0]}</span>
      </div>
      ${tarotNote ? `<div class="card-tarot-note">${tarotNote}</div>` : ''}
    </div>
  `;
}

function render() {
  const container = document.getElementById('gen-sections');
  const entries = Object.entries(CHARACTERS).filter(([name, c]) => {
    if (state.generation !== 'All' && c.generation !== state.generation) return false;
    if (state.category !== 'All' && categoryClass(c.category) !== state.category.toLowerCase()) return false;
    if (state.swingOnly && !c.is_swing) return false;
    if (state.search) {
      const hay = (name + c.role + c.want + c.fear + c.secret).toLowerCase();
      if (!hay.includes(state.search)) return false;
    }
    return true;
  });

  if (state.generation !== 'All') {
    container.innerHTML = `<div class="gen-block"><div class="grid">${entries.map(([n,c]) => cardHTML(n,c)).join('')}</div></div>`;
  } else {
    container.innerHTML = GEN_ORDER.map(gen => {
      const genEntries = entries.filter(([n,c]) => c.generation === gen);
      if (!genEntries.length) return '';
      return `
        <div class="gen-block">
          <div class="gen-title">${gen}</div>
          <div class="grid">${genEntries.map(([n,c]) => cardHTML(n,c)).join('')}</div>
        </div>
      `;
    }).join('');
  }

  document.querySelectorAll('.card').forEach(card => {
    card.onclick = () => openDetail(card.dataset.name);
  });
}

function openDetail(name) {
  const c = CHARACTERS[name];
  const cls = categoryClass(c.category);
  const tarotBlock = c.tarot ? `
    <div class="detail-tarot">${c.tarot.position} — ${c.tarot.card}<br>${c.tarot.note}</div>
  ` : '';
  const secretBadge = c.is_swing ? '<span class="badge-dynamic">DYNAMIC — player-determined</span>' : '<span class="badge-static">STATIC — locked lore</span>';
  const connHTML = c.connections.length ? c.connections.map(conn =>
    `<div class="connection"><b>${conn.with}</b> — ${conn.desc}</div>`
  ).join('') : '<div class="placeholder-note">No cross-connections beyond direct family/story ties.</div>';
  const inspHTML = c.inspiration ? `<div class="inspiration">${c.inspiration}</div>` : '<div class="placeholder-note">Not yet assigned — open for this character.</div>';

  const detailPortrait = c.image
    ? `<img class="detail-portrait" src="${c.image}" alt="${name}" onerror="this.remove()">`
    : '';
  document.getElementById('detail-content').innerHTML = `
    <button class="detail-close" onclick="closeDetail()">&times;</button>
    ${detailPortrait}
    <div class="detail-eyebrow" style="color:var(--${cls})">${c.category.replace(', sphere-swing', '')} ${c.is_swing ? '· SWING' : ''} · ${c.generation}</div>
    <div class="detail-name">${name}</div>
    <div class="detail-role">${c.role}</div>
    ${tarotBlock}
    <div class="field">
      <div class="field-label">Want</div>
      <div class="field-text">${c.want}</div>
    </div>
    <div class="field">
      <div class="field-label">Fear</div>
      <div class="field-text">${c.fear}</div>
    </div>
    <div class="field">
      <div class="field-label">Secret ${secretBadge}</div>
      <div class="field-text">${c.secret}</div>
    </div>
    <div class="field">
      <div class="field-label">Inspiration / Reference</div>
      ${inspHTML}
    </div>
    <div class="field">
      <div class="field-label">Connections</div>
      <div class="connections">${connHTML}</div>
    </div>
  `;
  document.getElementById('overlay').classList.add('open');
}
function closeDetail() {
  document.getElementById('overlay').classList.remove('open');
}
document.getElementById('overlay').onclick = (e) => {
  if (e.target.id === 'overlay') closeDetail();
};

buildControls();
render();
</script>
</body>
</html>
